version: "3.9"

services:
  app:
    build: .
    container_name: server

    ports:
      - "5001:5001"

    environment:
      NODE_ENV: production
      DATABASE_URL: mongodb://mongo:27017/roomfinder

    depends_on:
      - mongo

    restart: unless-stopped

  mongo:
    image: mongo:8
    container_name: mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

    restart: unless-stopped

volumes:
  mongo_data: